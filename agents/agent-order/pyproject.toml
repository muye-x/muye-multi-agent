[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muye-agent-order"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "muye-multi-agent-sdk @ git+https://github.com/muye-x/muye-multi-agent-sdk.git@e909ead9ec12bb7c2362e87ac16799ee59f358eb",
]

[tool.setuptools]
py-modules = ["main", "order_agent"]
