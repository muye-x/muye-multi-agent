name: muye

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ./control_server/.env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  control:
    build: .
    command: ["python", "-m", "control_server.main"]
    env_file:
      - path: ./control_server/.env
        required: false
    environment:
      MUYE_CONTROL_HOST: 0.0.0.0
      MUYE_CONTROL_STATE_ROOT: /var/lib/muye/control
    volumes: [control-state:/var/lib/muye/control]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]
    expose: ["9880"]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  dashboard-api:
    build: .
    command: ["python", "muye-gateway/dashboard_main.py"]
    env_file:
      - path: ./muye-gateway/.env
        required: false
    environment:
      MUYE_DASHBOARD_HOST: 0.0.0.0
      MUYE_CONTROL_BASE_URL: http://control:9880
    depends_on: [control]
    networks: [internal]
    expose: ["9870"]

  agent-main:
    build: .
    command: ["python", "agents/agent-main/main.py"]
    env_file:
      - path: ./agents/agent-main/.env
        required: false
    environment:
      MUYE_AGENT_HOST: 0.0.0.0
      MUYE_CONTROL_BASE_URL: http://control:9880
      MUYE_LLM_BASE_URL: http://muye-llm:9850
      MUYE_SDK_DATA_BASE_URL: http://muye-data:9840
    depends_on: [control, muye-llm, muye-data]
    networks: [internal]
    expose: ["9860"]

  muye-llm:
    build: .
    command: ["python", "muye-llm/main.py"]
    env_file:
      - path: ./muye-llm/.env
        required: false
    environment:
      MUYE_LLM_HOST: 0.0.0.0
    networks: [internal]
    expose: ["9850"]

  muye-data:
    build: .
    command: ["python", "muye-data/main.py"]
    env_file:
      - path: ./muye-data/.env
        required: false
    environment:
      MUYE_DATA_HOST: 0.0.0.0
      MUYE_DATA_LLM_BASE_URL: http://muye-llm:9850
      MUYE_DATA_AGENT_AUTH_ENABLED: "true"
      MUYE_DATA_AGENT_CATALOG_PATH: /var/lib/muye/control/active-catalog.json
    volumes: [control-state:/var/lib/muye/control:ro]
    depends_on: [muye-llm, control]
    networks: [internal]
    expose: ["9840"]

  gateway:
    build:
      context: .
      dockerfile: muye-gateway/Dockerfile
    env_file:
      - path: ./muye-gateway/.env
        required: false
    environment:
      MUYE_GATEWAY_TLS_CERTIFICATE: /etc/nginx/tls/tls.crt
      MUYE_GATEWAY_TLS_PRIVATE_KEY: /etc/nginx/tls/tls.key
      MUYE_AGENT_MAIN_URL: http://agent-main:9860
      MUYE_DASHBOARD_API_URL: http://dashboard-api:9870
      MUYE_CONTROL_BASE_URL: http://control:9880
    depends_on: [dashboard-api, agent-main]
    networks: [internal, public]
    ports: ["80:80", "443:443"]
    volumes:
      - ${MUYE_GATEWAY_TLS_CERTIFICATE_PATH:?set MUYE_GATEWAY_TLS_CERTIFICATE_PATH}:/etc/nginx/tls/tls.crt:ro
      - ${MUYE_GATEWAY_TLS_PRIVATE_KEY_PATH:?set MUYE_GATEWAY_TLS_PRIVATE_KEY_PATH}:/etc/nginx/tls/tls.key:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

networks:
  internal: { internal: true }
  public: {}

volumes:
  postgres-data: {}
  control-state: {}
