name: muye

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MUYE_POSTGRES_DB:?set MUYE_POSTGRES_DB}
      POSTGRES_USER: ${MUYE_POSTGRES_USER:?set MUYE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MUYE_POSTGRES_PASSWORD:?set MUYE_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  control:
    build: .
    command: ["python", "-m", "control_server.main"]
    environment:
      MUYE_CONTROL_HOST: 0.0.0.0
      MUYE_CONTROL_DATABASE_URL: ${MUYE_CONTROL_DATABASE_URL:?set MUYE_CONTROL_DATABASE_URL}
      MUYE_CONTROL_OPERATOR_TOKEN: ${MUYE_CONTROL_OPERATOR_TOKEN:?set MUYE_CONTROL_OPERATOR_TOKEN}
      MUYE_CONTROL_MAIN_TOKEN: ${MUYE_CONTROL_MAIN_TOKEN:?set MUYE_CONTROL_MAIN_TOKEN}
      MUYE_CONTROL_HEALTH_TOKEN: ${MUYE_CONTROL_HEALTH_TOKEN:?set MUYE_CONTROL_HEALTH_TOKEN}
      MUYE_CONTROL_GATEWAY_TOKEN: ${MUYE_CONTROL_GATEWAY_TOKEN:?set MUYE_CONTROL_GATEWAY_TOKEN}
      MUYE_CONTROL_AGENT_TOKENS_JSON: ${MUYE_CONTROL_AGENT_TOKENS_JSON:-{}}
      MUYE_CONTROL_STATE_ROOT: /var/lib/muye/control
    volumes: [control-state:/var/lib/muye/control]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]
    expose: ["9880"]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  dashboard-api:
    build: .
    command: ["python", "muye-gateway/dashboard_main.py"]
    environment:
      MUYE_DASHBOARD_HOST: 0.0.0.0
      MUYE_CONTROL_BASE_URL: http://control:9880
      MUYE_GATEWAY_CONTROL_TOKEN: ${MUYE_GATEWAY_CONTROL_TOKEN:?set MUYE_GATEWAY_CONTROL_TOKEN}
    depends_on: [control]
    networks: [internal]
    expose: ["9870"]

  agent-main:
    build: .
    command: ["python", "agents/agent-main/main.py"]
    environment:
      MUYE_SERVER_HOST: 0.0.0.0
      MUYE_CONTROL_BASE_URL: http://control:9880
      MUYE_CONTROL_MAIN_TOKEN: ${MUYE_CONTROL_MAIN_TOKEN:?set MUYE_CONTROL_MAIN_TOKEN}
      MUYE_MAIN_CALLER_TOKEN: ${MUYE_MAIN_CALLER_TOKEN:?set MUYE_MAIN_CALLER_TOKEN}
      MUYE_MAIN_AGENT_TOKENS_JSON: ${MUYE_MAIN_AGENT_TOKENS_JSON:-{}}
      MUYE_LLM_BASE_URL: http://muye-llm:9850
    depends_on: [control, muye-llm, muye-data]
    networks: [internal]
    expose: ["9860"]

  muye-llm:
    build: .
    command: ["python", "muye-llm/main.py"]
    environment:
      MUYE_LLM_HOST: 0.0.0.0
      MUYE_LLM_API_BASE_URL: ${MUYE_LLM_API_BASE_URL:?set MUYE_LLM_API_BASE_URL}
      MUYE_LLM_API_KEY: ${MUYE_LLM_API_KEY:?set MUYE_LLM_API_KEY}
      MUYE_LLM_DEFAULT_MODEL: ${MUYE_LLM_DEFAULT_MODEL:?set MUYE_LLM_DEFAULT_MODEL}
      MUYE_LLM_MODELS_JSON: ${MUYE_LLM_MODELS_JSON:?set MUYE_LLM_MODELS_JSON}
    networks: [internal]
    expose: ["9850"]

  muye-data:
    build: .
    command: ["python", "muye-data/main.py"]
    environment:
      MUYE_DATA_HOST: 0.0.0.0
      MUYE_DATA_CONFIG_PATH: ${MUYE_DATA_CONFIG_PATH:?set MUYE_DATA_CONFIG_PATH}
      MUYE_DATA_LLM_BASE_URL: http://muye-llm:9850
      MUYE_DATA_AGENT_AUTH_ENABLED: "true"
      MUYE_DATA_AGENT_CATALOG_PATH: /var/lib/muye/control/active-catalog.json
      MUYE_DATA_AGENT_TOKENS_JSON: ${MUYE_DATA_AGENT_TOKENS_JSON:?set MUYE_DATA_AGENT_TOKENS_JSON}
    volumes: [control-state:/var/lib/muye/control:ro]
    depends_on: [muye-llm, control]
    networks: [internal]
    expose: ["9840"]

  gateway:
    build:
      context: .
      dockerfile: muye-gateway/Dockerfile
    environment:
      MUYE_GATEWAY_SERVER_NAME: ${MUYE_GATEWAY_SERVER_NAME:?set MUYE_GATEWAY_SERVER_NAME}
      MUYE_GATEWAY_TLS_CERTIFICATE: /etc/nginx/tls/tls.crt
      MUYE_GATEWAY_TLS_PRIVATE_KEY: /etc/nginx/tls/tls.key
      MUYE_GATEWAY_CLIENT_MAX_BODY_SIZE: ${MUYE_GATEWAY_CLIENT_MAX_BODY_SIZE:-10m}
      MUYE_GATEWAY_PROXY_READ_TIMEOUT: ${MUYE_GATEWAY_PROXY_READ_TIMEOUT:-3600s}
      MUYE_GATEWAY_PROXY_SEND_TIMEOUT: ${MUYE_GATEWAY_PROXY_SEND_TIMEOUT:-3600s}
      MUYE_AGENT_MAIN_URL: http://agent-main:9860
      MUYE_DASHBOARD_API_URL: http://dashboard-api:9870
      MUYE_CONTROL_BASE_URL: http://control:9880
      MUYE_MAIN_CALLER_TOKEN: ${MUYE_MAIN_CALLER_TOKEN:?set MUYE_MAIN_CALLER_TOKEN}
    depends_on: [dashboard-api, agent-main]
    networks: [internal, public]
    ports: ["80:80", "443:443"]
    volumes:
      - ${MUYE_GATEWAY_TLS_CERTIFICATE_PATH:?set MUYE_GATEWAY_TLS_CERTIFICATE_PATH}:/etc/nginx/tls/tls.crt:ro
      - ${MUYE_GATEWAY_TLS_PRIVATE_KEY_PATH:?set MUYE_GATEWAY_TLS_PRIVATE_KEY_PATH}:/etc/nginx/tls/tls.key:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

networks:
  internal: { internal: true }
  public: {}

volumes:
  postgres-data: {}
  control-state: {}
